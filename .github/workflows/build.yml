name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Maak direct een GitHub Release aan"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (bijv. v5.5.0) - alleen nodig als je handmatig een release triggert"
        type: string
        default: ""

jobs:
  build:
    name: Build Extensions & Userscript
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run build script
        run: npm run build

      - name: Upload Chromium Extension
        uses: actions/upload-artifact@v4
        with:
          name: SomtodayMod-Chromium
          path: dist/chromium.zip

      - name: Upload Firefox Extension
        uses: actions/upload-artifact@v4
        with:
          name: SomtodayMod-Firefox
          path: dist/firefox.zip

      - name: Upload Userscript
        uses: actions/upload-artifact@v4
        with:
          name: SomtodayMod-Userscript
          path: dist/SomtodayMod.user.js

      - name: Upload Minified Userscript
        uses: actions/upload-artifact@v4
        with:
          name: SomtodayMod-Userscript-Minified
          path: dist/SomtodayMod.min.user.js

      - name: Publish to GitHub Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/chromium.zip
            dist/firefox.zip
            dist/SomtodayMod.user.js
            dist/SomtodayMod.min.user.js
