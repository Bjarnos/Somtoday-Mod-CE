name: Release
run-name: Release ${{ github.ref_name }}

on:
  release:
    types: [ published ]
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release directly"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (e.g. v5.5.0) - only needed if you trigger a release manually"
        type: string
        default: ""
      publish_stores:
        description: "Publish to extension stores (Chrome, Firefox, Edge)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Extensions & Userscript
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run build script
        run: npm run build

      - name: Extract Tag Message
        id: tag_info
        if: startsWith(github.ref, 'refs/tags/')
        run: |
            TAG_MSG=$(git tag -l --format='%(contents)' ${{ github.ref_name }})
            echo "tag_body<<EOF" >> $GITHUB_OUTPUT
            echo "$TAG_MSG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload Chromium Extension
        uses: actions/upload-artifact@v4
        with:
          name: SomtodayMod-Chromium
          path: dist/chromium.zip

      - name: Upload Firefox Extension
        uses: actions/upload-artifact@v4
        with:
          name: SomtodayMod-Firefox
          path: dist/firefox.zip

      - name: Upload Userscript
        uses: actions/upload-artifact@v4
        with:
          name: SomtodayMod-Userscript
          path: dist/SomtodayMod.user.js

      - name: Upload Minified Userscript
        uses: actions/upload-artifact@v4
        with:
          name: SomtodayMod-Userscript-Minified
          path: dist/SomtodayMod.min.user.js

      - name: Publish to GitHub Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
          name: ${{ github.event.release.name || inputs.release_tag || github.ref_name }}
          body: ${{ steps.tag_info.outputs.tag_body }}
          generate_release_notes: true
          preserve_order: true
          files: |
            dist/chromium.zip
            dist/firefox.zip
            dist/SomtodayMod.user.js
            dist/SomtodayMod.min.user.js

  publish-stores:
    name: Publish to Extension Stores
    needs: build
    runs-on: ubuntu-latest
    environment: extension-stores

    if: |
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.publish_stores == true))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Chromium Extension
        uses: actions/download-artifact@v4
        with:
          name: SomtodayMod-Chromium
          path: dist

      - name: Download Firefox Extension
        uses: actions/download-artifact@v4
        with:
          name: SomtodayMod-Firefox
          path: dist

      - name: Publish to Chrome Web Store
        if: secrets.CHROME_CLIENT_SECRET != ''
        continue-on-error: true
        uses: PlasmoHQ/bpp@v3
        with:
          keys: |
            {
              "chrome": {
                "clientId": "${{ secrets.CHROME_CLIENT_ID }}",
                "clientSecret": "${{ secrets.CHROME_CLIENT_SECRET }}",
                "refreshToken": "${{ secrets.CHROME_REFRESH_TOKEN }}",
                "extId": "${{ vars.CHROME_EXTENSION_ID }}",
                "zip": "dist/chromium.zip"
              }
            }
          chrome-file: dist/chromium.zip
          verbose: true

      - name: Publish to Firefox Add-ons (AMO)
        if: secrets.FIREFOX_JWT_SECRET != ''
        continue-on-error: true
        uses: PlasmoHQ/bpp@v3
        with:
          keys: |
            {
              "firefox": {
                "issuer": "${{ secrets.FIREFOX_JWT_ISSUER }}",
                "secret": "${{ secrets.FIREFOX_JWT_SECRET }}",
                "extId": "${{ vars.FIREFOX_EXTENSION_ID || 'somtoday-mod-ce@bjarnos.dev' }}",
                "zip": "dist/firefox.zip"
              }
            }
          firefox-file: dist/firefox.zip
          verbose: true

      - name: Publish to Microsoft Edge Add-ons
        if: secrets.EDGE_API_KEY != ''
        continue-on-error: true
        uses: PlasmoHQ/bpp@v3
        with:
          keys: |
            {
              "edge": {
                "productId": "${{ vars.EDGE_PRODUCT_ID }}",
                "clientId": "${{ secrets.EDGE_CLIENT_ID }}",
                "apiKey": "${{ secrets.EDGE_API_KEY }}",
                "zip": "dist/chromium.zip"
              }
            }
          edge-file: dist/chromium.zip
          verbose: true
